<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="Register.css">
</head>
<body>
    <header class="header">
    <div class="background-image">
        
        <div class="line">
            <img src="LOGO CICOT.png" alt="CICOT Logo" class="logo1">
            <img src="Halal English.png" alt="HALAL MARK" class="logo2">
            <img src="Patterned Thai Flag.png" alt="Thailand Flag" class="logo3">
        </div>
         <div class="header-title">
            <h1>The Central Islamic Council of Thailand (CICOT)</h1>
            <p>Foreign Halal Certification Body Recognition System</p>
        </div>
    </div>
    <nav class="navbar">
            <a href="index.html">CICOT Website</a>
            <a href="index.html">Home</a>
            <a href="About.html">About Us</a>
            <a href="Contact.html">Contact Us</a>
            <a href="Login.html">Login to Apply</a>
            <a href="Register.html">Register</a>
    </nav>
    </header>
    <div class="register-container">
        <h2>Registration</h2>
        <div class="register-form">
        <form action="/submit_register" id="register" method="POST">
            <div class="type-channel">
            <label for="Company/Organization Name">Company/Organization Name:</label>
            <input type="text" id="Company/Organization Name" name="Company/Organization Name" placeholder="Foreign Halal Certification Body Name">
           
            <div class="type-channel">
            <label for ="email">Email:</label>
            <input type="email" id="email" name="email" required>
            </div>
            <div class="type-channel">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            </div>
            <div class="type-channel">
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <div class="type-channel">
            <label for="OTP">OTP Verification:</label>
            <input type="text" id="OTP" name="OTP" placeholder="OTP from your Email">
            </div>
            <div class="tooltip">
            <input type="submit" value="Register">
            </div>
        </form>
        </div>
    </div>
</body>
</html>
